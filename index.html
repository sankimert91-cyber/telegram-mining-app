<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Mining App</title>
    <style>
        body {
            background-color: #0d1117;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #161b22;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.3);
        }
        .power-box {
            background: #1f262e;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .balance {
            font-size: 28px;
            color: #00ffcc;
            font-weight: bold;
            margin: 20px 0;
        }
        .info-text {
            color: #8b949e;
            font-size: 14px;
            margin-top: 15px;
            margin-bottom: 25px;
        }
        button {
            background: #00ffcc;
            color: #0d1117;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 10px;
        }
        button:hover {
            background: #00ccaa;
        }
        .btn-video {
            background: #58a6ff;
            color: white;
        }
        .btn-video:hover {
            background: #1f6feb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>DEINE POWER</h2>
    <div class="power-box">
        <span style="font-size: 24px; color: #58a6ff;" id="power-display">1.0K</span><br>
        <small style="color: #8b949e;">POWER</small>
    </div>

    <div>HASHES MINED</div>
    <div class="balance" id="balance-display">0.00000000</div>

    <div class="info-text">
        🔒 Mindestauszahlung: <strong>10.00000000 Hashes</strong>
    </div>

    <button class="btn-video" onclick="watchVideo()">📺 Video schauen (+0.5K Power)</button>

    <button onclick="claimHashes()">SWAP HASHES</button>
</div>

<script>
    // Startwerte
    let hashesMined = 0.00000000;
    let currentPower = 1.0; // Repräsentiert 1.0K Power
    
    // Mining-Geschwindigkeit stark verlangsamt (vorher 0.00001234)
    let miningSpeed = 0.00000005; 

    const balanceDisplay = document.getElementById('balance-display');
    const powerDisplay = document.getElementById('power-display');

    // Automatisches Mining jede Sekunde
    setInterval(() => {
        hashesMined += (miningSpeed * currentPower);
        balanceDisplay.innerText = hashesMined.toFixed(8);
    }, 1000);

    // Funktion für den Video-Button
    function watchVideo() {
        // Hier wird später der echte Werbe-Code von Adsgram eingefügt.
        // Aktuell simulieren wir den Erfolg:
        alert("Video beendet! Du hast +0.5K Power erhalten.");
        currentPower += 0.5;
        powerDisplay.innerText = currentPower.toFixed(1) + "K";
    }

    // Funktion für den Auszahlungs-Button mit der 10.0-Grenze
    function claimHashes() {
        if(hashesMined >= 10.00000000) {
            alert("Auszahlung von " + hashesMined.toFixed(8) + " Hashes wurde beantragt!");
            hashesMined = 0;
            balanceDisplay.innerText = hashesMined.toFixed(8);
        } else {
            let fehlt = 10.00000000 - hashesMined;
            alert("Du hast noch nicht genug Hashes! Dir fehlen noch " + fehlt.toFixed(8) + " Hashes für die Auszahlung.");
        }
    }
</script>

</body>
</html>
